# Pages CMS config (https://pagescms.org): edit the price list from the browser.
# Lists are collapsed by default, each row titled by its name (summary).
content:
  - name: pricing
    label: Preçário
    type: file
    path: src/data/pricing.json
    format: json
    fields:
      - name: sections
        label: Categorias
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Nome, type: string, required: true }
          - { name: intro, label: Introdução, type: string }
          - name: groups
            label: Grupos
            type: object
            list:
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Título, type: string, required: true }
              - name: items
                label: Produtos
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{name} — {price}" }
                fields:
                  - { name: name, label: Produto, type: string, required: true }
                  - { name: price, label: Preço, type: string, required: true, description: "Ex.: 25,00 € · 18,00 € / kg · 1,50 € / un. Escreva «Sob consulta» para preço sob pedido." }
                  - { name: note, label: "Descrição (opcional)", type: string, description: "Pequeno texto por baixo do nome, ex.: sabores disponíveis." }
              - { name: footnote, label: "Nota (opcional)", type: string, description: "Aparece por baixo da lista, ex.: «Mais 2,00 € por dúzia se forem entregues fritos.»" }
              - { name: priceHead, label: "Legenda da coluna de preços (opcional)", type: string, description: "Só se os preços tiverem duas colunas, ex.: «Pequeno / normal»." }
          - { name: id, label: Âncora, type: string, required: true, description: "Identificador técnico da categoria (minúsculas, sem espaços nem acentos, ex.: bolos). Não alterar nas categorias existentes." }
      - name: notice
        label: Aviso (Brevemente)
        type: object
        description: "Caixa no fim da página do preçário."
        fields:
          - { name: show, label: Mostrar, type: boolean, description: "Desmarque para esconder a caixa do site." }
          - { name: badge, label: Etiqueta, type: string, description: "Ex.: Brevemente" }
          - { name: title, label: Título, type: string, required: true }
          - { name: text, label: Texto, type: string, required: true, description: "A frase «Siga-nos no Instagram para saber primeiro.» é acrescentada automaticamente." }

  - name: legal
    label: Informação legal
    type: file
    path: src/data/legal.json
    format: json
    fields:
      - { name: holder, label: Titular, type: string, required: true, description: "Nome legal da empresária em nome individual ou da sociedade." }
      - { name: nif, label: NIF, type: string, required: true, description: "Número de identificação fiscal (ou NIPC, se for sociedade)." }
      - { name: address, label: Morada, type: string, required: true, description: "Morada completa, com código postal." }
      - { name: email, label: E-mail, type: string, required: true, description: "E-mail de contacto mostrado no site." }
      - { name: updated, label: Última atualização, type: string, required: true, description: "Ex.: 25 de novembro de 2026. Atualize sempre que mudar alguma informação." }
